# Production deploys: `npm run build` is `dotenvx run -f .env.production -- nuxt
# build`, so it decrypts .env.production with DOTENV_PRIVATE_KEY_PRODUCTION (set
# in Netlify env, Builds scope) and bakes the NUXT_* + server runtimeConfig
# values into the bundle for the deployed function.
[build]
  command = "npx nuxt prepare && npm run test:ci && npm run build"
  publish = "dist"

# Deploy previews and branch deploys decrypt .env.dev instead (via
# DOTENV_PRIVATE_KEY_DEV) so they never build against the production database.
# Until previews are enabled, these contexts never run and .env.dev sits unused.
[context.deploy-preview]
  command = "npx nuxt prepare && npm run test:ci && npm run build:dev"

[context.branch-deploy]
  command = "npx nuxt prepare && npm run test:ci && npm run build:dev"

# Scheduled function: purges users whose soft-delete grace period has
# elapsed. See netlify/functions/purge-deleted-accounts.mts and
# server/utils/purgeAccounts.ts. Runs daily at 03:00 UTC — grace period is
# tracked in whole days (DELETE_GRACE_PERIOD_DAYS, server/utils/accountLifecycle.ts),
# so daily granularity is sufficient.
[functions."purge-deleted-accounts"]
  schedule = "0 3 * * *"

# Scheduled function: refreshes Instagram long-lived tokens nearing their
# 60-day expiry so imports keep working for accounts that go quiet. See
# netlify/functions/refresh-instagram-tokens.mts and
# server/utils/refreshInstagramTokens.ts. Runs daily at 04:00 UTC — the
# refresh threshold is 10 days (INSTAGRAM_REFRESH_THRESHOLD_DAYS), so daily
# granularity renews every token with ample margin before it lapses.
[functions."refresh-instagram-tokens"]
  schedule = "0 4 * * *"

[context.production]
  ignore = "if [ -n \"$INCOMING_HOOK_TITLE\" ]; then exit 1; else exit 0; fi"